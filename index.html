    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      // a página apareceria clara por um quadro antes de virar escura, e esse
      // lampejo branco na abertura não tem como ser desligado depois.
      document.documentElement.classList.add('dark')
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
